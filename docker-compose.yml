services:
  tunedig:
    build: .
    container_name: tunedig
    ports:
      - "8000:8000"
    volumes:
      # Point this at the music library scanned by Navidrome
      - ./music:/music
    # Navidrome and ListenBrainz configuration: copy .env.example to .env
    env_file:
      - path: .env
        required: false
    # Uncomment so the files are owned by your user rather than root
    # (useful if Navidrome runs with the same UID):
    # user: "1000:1000"
    restart: unless-stopped
