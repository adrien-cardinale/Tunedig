services:
  tunedig:
    build: .
    container_name: tunedig
    ports:
      - "8000:8000"
    volumes:
      # À pointer vers la bibliothèque musicale scannée par Navidrome
      - ./music:/music
    # Configuration Navidrome et ListenBrainz : copier .env.example en .env
    env_file:
      - path: .env
        required: false
    # Décommenter pour que les fichiers appartiennent à votre utilisateur
    # plutôt qu'à root (utile si Navidrome tourne avec ce même UID) :
    # user: "1000:1000"
    restart: unless-stopped
